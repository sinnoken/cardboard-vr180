# 在 GitHub 雲端編譯 APK：每次推送程式碼都會自動執行，也可以在 Actions 頁面手動按「Run workflow」。
name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: 安裝 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 安裝 Android SDK（並接受授權，缺少的平台由 Gradle 自動下載）
        uses: android-actions/setup-android@v4

      - name: 安裝 Gradle 9.9.0（含快取）
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'

      # 選用：固定簽章金鑰。沒設定時每次編譯會用不同的除錯金鑰，
      # 手機上要先移除舊版才能安裝新版。設定方式見 README。
      - name: 還原固定的除錯金鑰
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: 編譯除錯版 APK
        run: gradle assembleDebug --stacktrace

      - name: 上傳 APK
        uses: actions/upload-artifact@v7
        with:
          name: VR180Player-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
