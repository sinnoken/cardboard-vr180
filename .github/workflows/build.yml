# 在 GitHub 雲端編譯 APK：每次推送程式碼都會自動執行，也可以在 Actions 頁面手動按「Run workflow」。
# 推 v* tag 時另外把 APK 附到同名的 GitHub Release（沒有就建立一個預先發行版）。
# 只改文件（docs/、*.md）不建置；同一個 commit 已有更早的建置成功或正在跑就跳過（tag 與手動執行除外）。
name: Build APK

on:
  push:
    # tag 不受路徑篩選影響（GitHub 對 tag push 不看 paths），發行一定會建置
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

jobs:
  # 去重：同一個 commit 已經有更早的一次建置成功或正在跑，就不再建置
  # （例如先打 tag 發行，再 fast-forward 合併到 main）。只看更早的，兩個同時推的建置才不會互相跳過。
  # tag 一律建置：要編出正式版本號的 APK 附到 Release；手動執行也一律建置。
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.dup.outputs.skip }}
    steps:
      - name: 檢查這個 commit 是否已建置過
        id: dup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [ "$GITHUB_REF_TYPE" != tag ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            q="[.workflow_runs[] | select(.id < $GITHUB_RUN_ID)"
            q="$q | select(.status != \"completed\" or .conclusion == \"success\")] | length"
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$GITHUB_SHA&per_page=50"               -q "$q" || echo 0)
            if [ "$n" -gt 0 ]; then skip=true; echo "這個 commit 已有更早的建置成功或正在跑，跳過"; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # 推 tag 時上傳 APK 到 Release

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 要完整歷史與 tag 才算得出版本號

      - name: 安裝 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 安裝 Android SDK（並接受授權，缺少的平台由 Gradle 自動下載）
        uses: android-actions/setup-android@v4

      - name: 安裝 Gradle 9.9.0（含快取）
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'

      # 著色器在 App 執行時才編譯，Gradle 建置抓不到語法錯誤：這裡先用 Khronos 的 glslang 驗證
      - name: 驗證著色器（glslang）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools > /dev/null
          python3 - <<'EOF'
          import re
          s = open('app/src/main/java/com/example/vr180/render/Shaders.kt', encoding='utf-8').read()
          for name, ext in (('VERTEX', 'vert'), ('FRAGMENT', 'frag')):
              src = re.search(r'const val %s = """(.*?)"""' % name, s, re.S).group(1)
              open('/tmp/shader.' + ext, 'w', encoding='utf-8').write(src)
          EOF
          glslangValidator /tmp/shader.vert
          glslangValidator /tmp/shader.frag

      # 版本號由最近的 vX.Y.Z tag 與之後的 commit 數算出，規則見 docs/development.md
      - name: 計算版本號
        id: version
        run: |
          d=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --long 2>/dev/null || true)
          if [ -z "$d" ]; then
            name=0.0.0-dev; code=1
          else
            n=${d%-g*}; n=${n##*-}
            ver=${d%-*-g*}; ver=${ver#v}
            IFS=. read -r ma mi pa <<< "$ver"
            [ "$n" -gt 99 ] && n=99
            code=$(( (ma * 10000 + mi * 100 + pa) * 100 + n ))
            name=$ver; [ "$n" -ne 0 ] && name="$ver-dev.$n"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "版本 $name（versionCode $code）"

      # 選用：固定簽章金鑰。沒設定時每次編譯會用不同的除錯金鑰，
      # 手機上要先移除舊版才能安裝新版。設定方式見 README。
      - name: 還原固定的除錯金鑰
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: 單元測試、編譯除錯版 APK
        run: >
          gradle testDebugUnitTest assembleDebug --stacktrace
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: 上傳 APK
        uses: actions/upload-artifact@v7
        with:
          name: VR180Player-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 附到 GitHub Release（推 v* tag 時）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          HAS_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
        run: |
          # 沒有固定金鑰的 APK 不能覆蓋安裝舊版，不發布
          if [ "$HAS_KEY" != "true" ]; then echo "缺少 DEBUG_KEYSTORE_BASE64，不發布"; exit 1; fi
          apk="VR180Player-${TAG#v}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --prerelease --title "$TAG（除錯版）" --notes "測試影片請見 v0.1.2。"
          gh release upload "$TAG" "$apk" --clobber
