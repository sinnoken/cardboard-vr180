# 發行：在 Actions 頁面選「Release」→「Run workflow」。
# 版本號不填就從最新的 vX.Y.Z 自動加一（預設 patch）；說明不填就從上一版以來的 feat:/fix: commit 整理。
# 不重新編譯：直接拿 Build APK 為同一個 commit 編好的 APK，改名後建 tag 與 GitHub Release。
# 這個 commit 的建置沒有成功（失敗、還在跑、只改文件沒建置、沒有固定金鑰）就停止，不會發出去。規則見 docs/development.md。
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 版本號加哪一位（版本號空白時使用）
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: 指定版本號 X.Y.Z（空白則自動計算）
        required: false
        default: ''
      notes:
        description: Release 說明（空白則從 commit 自動整理）
        required: false
        default: ''
      prerelease:
        description: 標成預先發行版
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # 建 tag 與 Release
      actions: read     # 找建置紀錄、下載 APK
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 要完整歷史與 tag 才能算版本號、整理說明

      - name: 決定版本號
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -n "$INPUT_VERSION" ]; then
            v=$INPUT_VERSION
          else
            IFS=. read -r ma mi pa <<< "${prev#v}"
            ma=${ma:-0}; mi=${mi:-0}; pa=${pa:-0}
            case "$BUMP" in
              major) v="$((ma + 1)).0.0" ;;
              minor) v="$ma.$((mi + 1)).0" ;;
              *)     v="$ma.$mi.$((pa + 1))" ;;
            esac
          fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本號要是 X.Y.Z，收到：$v"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$v" > /dev/null || gh release view "v$v" > /dev/null 2>&1; then
            echo "::error::v$v 已經存在"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "發行 v$v（上一版 ${prev:-無}）"

      # 沒有固定金鑰的 APK 不能覆蓋安裝舊版，不發布
      - name: 檢查簽章金鑰
        env:
          HAS_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then echo "::error::缺少 DEBUG_KEYSTORE_BASE64，不發布"; exit 1; fi

      - name: 找這個 commit 的建置結果
        id: build
        run: |
          # 有上傳 APK 的那次才算（去重跳過的建置沒有 artifact）
          run_id=$(gh api "repos/$GH_REPO/actions/artifacts?name=VR180Player-debug&per_page=100" \
            -q "[.artifacts[] | select(.workflow_run.head_sha == \"$GITHUB_SHA\" and .expired == false)][0].workflow_run.id // empty")
          if [ -z "$run_id" ]; then
            echo "::error::$GITHUB_SHA 沒有可用的 APK：Build APK 還沒跑完、失敗、只改了文件，或沒有用固定金鑰簽章（例如 Dependabot 的建置）。可以在 Build APK 手動執行一次再發行"; exit 1
          fi
          conclusion=$(gh run view "$run_id" --json conclusion -q .conclusion)
          if [ "$conclusion" != success ]; then
            echo "::error::建置 $run_id 的結果是 $conclusion，不發布"; exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "使用建置 $run_id 的 APK（commit $GITHUB_SHA）"

      - name: 整理說明
        env:
          NOTES: ${{ inputs.notes }}
          PREV: ${{ steps.version.outputs.prev }}
        run: |
          if [ -n "$NOTES" ]; then printf '%s\n' "$NOTES" > notes.md; exit 0; fi
          range=${PREV:+$PREV..}$GITHUB_SHA
          section() {   # $1 標題，$2 commit 類型
            lines=$(git log --no-merges --format='%s' "$range" | grep -E "^$2(\(.+\))?!?: " | sed -E "s/^$2(\(.+\))?!?: /- /" || true)
            [ -n "$lines" ] && printf '## %s\n\n%s\n\n' "$1" "$lines"
            return 0
          }
          { section New feat; section Fixes fix; } > notes.md
          [ -s notes.md ] || echo "Maintenance release." > notes.md
          [ -n "$PREV" ] && echo "Full changelog: https://github.com/$GH_REPO/compare/$PREV...v${{ steps.version.outputs.version }}" >> notes.md
          cat notes.md

      - name: 下載 APK 並改名
        run: |
          gh run download "${{ steps.build.outputs.run_id }}" -n VR180Player-debug -D apk
          mv apk/app-debug.apk "VR180Player-${{ steps.version.outputs.version }}-debug.apk"

      - name: 建立 Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--target "$GITHUB_SHA" --title "v$VERSION（除錯版）" --notes-file notes.md)
          [ "$PRERELEASE" = true ] && args+=(--prerelease)
          gh release create "v$VERSION" "VR180Player-$VERSION-debug.apk" "${args[@]}"
